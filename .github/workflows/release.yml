name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip3
      # Variante si wasm32-wasip3 n'est pas encore disponible en stable :
      # - uses: dtolnay/rust-toolchain@nightly
      #   with:
      #     components: rust-src
      # et remplacer l'étape Build par :
      #   cargo build --release -Zbuild-std=std,panic_abort

      - uses: Swatinem/rust-cache@v2.9.3 

      - name: Vérifier que le tag correspond à la version du Cargo.toml
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$CARGO_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Le tag ${GITHUB_REF_NAME} ne correspond pas à la version $CARGO_VERSION"
            exit 1
          fi

      - name: Tests unitaires
        # La cible par défaut est wasm, on force la cible native de la CI
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --locked --release   # utilise la cible de .cargo/config.toml

      - name: Préparer l'artefact
        run: |
          cp target/wasm32-wasip3/release/infected.wasm \
             "infected-${GITHUB_REF_NAME}.wasm"
          sha256sum "infected-${GITHUB_REF_NAME}.wasm" > "infected-${GITHUB_REF_NAME}.wasm.sha256"

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "infected-${GITHUB_REF_NAME}.wasm" \
            "infected-${GITHUB_REF_NAME}.wasm.sha256"