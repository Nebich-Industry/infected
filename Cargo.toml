[package]
name = "infected"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Plugin Minecraft (Pumpkin) : mini-jeu de survie de zombies"
repository = "https://github.com/Nebich-Industry/infected"

[lib] 
crate-type = ["cdylib"]

[profile.release] 
lto = true

[dependencies]
# This is the api crate that makes creating plugins easier, and has wit definitions
pumpkin-plugin-api = "0.2.1+26.3-26.51"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
